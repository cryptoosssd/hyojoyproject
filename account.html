<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор аккаунта — HyoJoy</title>
<style>
:root {
    --bg: #1a1a1a; --bg-panel: #2a2a2a; --bg-input: #1f1f1f;
    --bg-input-focus: #242424; --bg-hover: #3a3a3a; --bg-active: #4a4a4a;
    --border: #3a3a3a; --border-hover: #555555;
    --text: #e0e0e0; --text-dim: #999999; --text-strong: #ffffff; --text-muted: #888888;
    --danger: #cc8888; --danger-bg: #3a1f1f; --danger-border: #553333;
    --success: #88cc88; --success-bg: #1f3a1f; --success-border: #335533;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: 0.2s; }

.header {
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
    padding: 14px 30px;
    display: flex; justify-content: space-between; align-items: center;
}
.logo { color: var(--text-strong); font-size: 18px; letter-spacing: 3px; text-transform: uppercase; font-weight: bold; cursor: pointer; }
.back-btn {
    background: none; border: 1px solid var(--border-hover); color: var(--text);
    padding: 8px 16px; font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; transition: 0.2s;
}
.back-btn:hover { background: var(--bg-hover); color: var(--text-strong); }

.main { flex: 1; padding: 50px 40px; display: flex; justify-content: center; }
.panel { width: 440px; }
h1 { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-strong); margin-bottom: 30px; }
h2 {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 16px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.section { margin-bottom: 40px; }
.input-group { margin-bottom: 16px; }
.input-group label {
    display: block; font-size: 11px; color: var(--text-dim);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}
.input-group input {
    width: 100%; padding: 14px; background: var(--bg-input);
    border: 1px solid var(--border); color: var(--text); font-size: 14px;
    outline: none; transition: 0.2s;
}
.input-group input:focus { border-color: var(--border-hover); background: var(--bg-input-focus); }
.btn {
    width: 100%; padding: 14px; background: var(--bg-active);
    border: 1px solid var(--border-hover); color: var(--text-strong);
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: 0.2s;
}
.btn:hover { background: var(--bg-hover); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.message { margin-top: 14px; padding: 12px; font-size: 13px; text-align: center; display: none; border: 1px solid; }
.message.error { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); display: block; }
.message.success { background: var(--success-bg); color: var(--success); border-color: var(--success-border); display: block; }
</style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="location.href='index.html'">HyoJoy</div>
    <button class="back-btn" onclick="location.href='index.html'" data-i18n="account.back">Назад</button>
</div>

<div class="main">
    <div class="panel">
        <h1 data-i18n="account.title">Редактор аккаунта</h1>

        <div class="section">
            <h2 data-i18n="account.change_nick">Смена ника</h2>
            <div class="input-group">
                <label data-i18n="account.new_nick">Новый ник</label>
                <input type="text" id="new-nick" placeholder="Введите новый ник">
            </div>
            <div class="input-group">
                <label data-i18n="account.confirm_pass">Пароль для подтверждения</label>
                <input type="password" id="nick-pass" placeholder="Ваш текущий пароль">
            </div>
            <button class="btn" id="nick-btn" data-i18n="account.change_nick_btn">Сменить ник</button>
            <div class="message" id="nick-msg"></div>
        </div>

        <div class="section">
            <h2 data-i18n="account.change_pass">Смена пароля</h2>
            <div class="input-group">
                <label data-i18n="account.current_pass">Текущий пароль</label>
                <input type="password" id="old-pass" placeholder="Введите текущий пароль">
            </div>
            <div class="input-group">
                <label data-i18n="account.new_pass">Новый пароль</label>
                <input type="password" id="new-pass" placeholder="Минимум 6 символов">
            </div>
            <div class="input-group">
                <label data-i18n="account.repeat_new_pass">Повторите новый пароль</label>
                <input type="password" id="new-pass2" placeholder="Повторите новый пароль">
            </div>
            <button class="btn" id="pass-btn" data-i18n="account.change_pass_btn">Сменить пароль</button>
            <div class="message" id="pass-msg"></div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getAuth, onAuthStateChanged, updateProfile,
    EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { initSettings } from './common.js';

initSettings();

const firebaseConfig = {
    apiKey: "AIzaSyCUSTTJhonzZPOKWUbe_qMZfMmVyFSxjPE",
    authDomain: "hyojoy-41840.firebaseapp.com",
    projectId: "hyojoy-41840",
    storageBucket: "hyojoy-41840.firebasestorage.app",
    messagingSenderId: "714253431446",
    appId: "1:714253431446:web:fe08e2cbe51c768dfd48b7",
    measurementId: "G-DQ3F2VMTCJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = 'auth.html';
        return;
    }
    currentUser = user;
    const nick = user.displayName || user.email.split('@')[0];
    document.getElementById('new-nick').value = nick;
});

function showMessage(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'message ' + type;
}

function translateError(code) {
    const map = {
        'auth/invalid-credential': 'Неверный пароль',
        'auth/wrong-password': 'Неверный пароль',
        'auth/weak-password': 'Пароль слишком простой',
        'auth/too-many-requests': 'Слишком много попыток',
        'auth/requires-recent-login': 'Войдите заново'
    };
    return map[code] || 'Ошибка: ' + code;
}

document.getElementById('nick-btn').addEventListener('click', async () => {
    const newNick = document.getElementById('new-nick').value.trim();
    const pass = document.getElementById('nick-pass').value;
    if (!newNick || !pass) return showMessage('nick-msg', 'Заполните все поля', 'error');
    if (newNick.length < 3) return showMessage('nick-msg', 'Ник минимум 3 символа', 'error');
    if (!/^[a-zA-Z0-9_]+$/.test(newNick)) return showMessage('nick-msg', 'Только латиница, цифры, _', 'error');

    const btn = document.getElementById('nick-btn');
    btn.disabled = true;
    try {
        const cred = EmailAuthProvider.credential(currentUser.email, pass);
        await reauthenticateWithCredential(currentUser, cred);
        await updateProfile(currentUser, { displayName: newNick });
        await updateDoc(doc(db, 'users', currentUser.uid), { nick: newNick });
        showMessage('nick-msg', 'Ник обновлён', 'success');
    } catch (e) {
        showMessage('nick-msg', translateError(e.code), 'error');
    }
    btn.disabled = false;
});

document.getElementById('pass-btn').addEventListener('click', async () => {
    const oldPass = document.getElementById('old-pass').value;
    const newPass = document.getElementById('new-pass').value;
    const newPass2 = document.getElementById('new-pass2').value;
    if (!oldPass || !newPass || !newPass2) return showMessage('pass-msg', 'Заполните все поля', 'error');
    if (newPass.length < 6) return showMessage('pass-msg', 'Пароль минимум 6 символов', 'error');
    if (newPass !== newPass2) return showMessage('pass-msg', 'Пароли не совпадают', 'error');

    const btn = document.getElementById('pass-btn');
    btn.disabled = true;
    try {
        const cred = EmailAuthProvider.credential(currentUser.email, oldPass);
        await reauthenticateWithCredential(currentUser, cred);
        await updatePassword(currentUser, newPass);
        showMessage('pass-msg', 'Пароль обновлён', 'success');
        document.getElementById('old-pass').value = '';
        document.getElementById('new-pass').value = '';
        document.getElementById('new-pass2').value = '';
    } catch (e) {
        showMessage('pass-msg', translateError(e.code), 'error');
    }
    btn.disabled = false;
});
</script>
</body>
</html>
