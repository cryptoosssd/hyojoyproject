<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход / Регистрация — HyoJoy</title>
<style>
:root {
    --bg: #1a1a1a; --bg-panel: #2a2a2a; --bg-input: #1f1f1f;
    --bg-input-focus: #242424; --bg-hover: #3a3a3a; --bg-active: #4a4a4a;
    --border: #3a3a3a; --border-hover: #555555;
    --text: #e0e0e0; --text-dim: #999999; --text-strong: #ffffff; --text-muted: #888888;
    --danger: #cc8888; --danger-bg: #3a1f1f; --danger-border: #553333;
    --success: #88cc88; --success-bg: #1f3a1f; --success-border: #335533;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { background: var(--bg-panel); padding: 40px; width: 360px; border: 1px solid var(--border); }
.tabs { display: flex; margin-bottom: 30px; }
.tab {
    flex: 1; padding: 14px; background: var(--bg-active); color: var(--text-dim);
    border: 1px solid var(--border); cursor: pointer; text-align: center;
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    transition: 0.2s;
}
.tab.active { background: var(--bg-hover); color: var(--text-strong); border-color: var(--border-hover); }
.tab:hover:not(.active) { background: var(--bg-hover); color: var(--text); }
.form { display: none; }
.form.active { display: block; }
.input-group { margin-bottom: 18px; }
.input-group label {
    display: block; font-size: 12px; color: var(--text-dim);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}
.input-group input {
    width: 100%; padding: 14px; background: var(--bg-input);
    border: 1px solid var(--border); color: var(--text); font-size: 14px;
    outline: none; transition: 0.2s;
}
.input-group input:focus { border-color: var(--border-hover); background: var(--bg-input-focus); }
.btn {
    width: 100%; padding: 16px; background: var(--bg-active);
    border: 1px solid var(--border-hover); color: var(--text-strong);
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: 0.2s; margin-top: 10px;
}
.btn:hover { background: var(--bg-hover); }
.btn:active { background: var(--bg-active); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.message { margin-top: 16px; padding: 12px; font-size: 13px; text-align: center; display: none; border: 1px solid; }
.message.error { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); display: block; }
.message.success { background: var(--success-bg); color: var(--success); border-color: var(--success-border); display: block; }
</style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <div class="tab active" data-tab="login">Вход</div>
        <div class="tab" data-tab="register">Регистрация</div>
    </div>

    <div class="form active" id="login-form">
        <div class="input-group">
            <label>Ник</label>
            <input type="text" id="login-nick" placeholder="Введите ник">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="login-pass" placeholder="Введите пароль">
        </div>
        <button class="btn" id="login-btn">Войти</button>
        <div class="message" id="login-msg"></div>
    </div>

    <div class="form" id="register-form">
        <div class="input-group">
            <label>Ник</label>
            <input type="text" id="reg-nick" placeholder="Придумайте ник">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="reg-pass" placeholder="Придумайте пароль">
        </div>
        <div class="input-group">
            <label>Повторите пароль</label>
            <input type="password" id="reg-pass2" placeholder="Повторите пароль">
        </div>
        <button class="btn" id="reg-btn">Зарегистрироваться</button>
        <div class="message" id="reg-msg"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCUSTTJhonzZPOKWUbe_qMZfMmVyFSxjPE",
    authDomain: "hyojoy-41840.firebaseapp.com",
    projectId: "hyojoy-41840",
    storageBucket: "hyojoy-41840.firebasestorage.app",
    messagingSenderId: "714253431446",
    appId: "1:714253431446:web:fe08e2cbe51c768dfd48b7",
    measurementId: "G-DQ3F2VMTCJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const nickToEmail = (nick) => nick.toLowerCase() + "@mysite.local";

// Никаких onAuthStateChanged — только форма. Это ломает цикл редиректов.
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + '-form').classList.add('active');
    });
});

function showMessage(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'message ' + type;
}

function translateError(code) {
    const map = {
        'auth/email-already-in-use': 'Такой ник уже занят',
        'auth/invalid-credential': 'Неверный ник или пароль',
        'auth/wrong-password': 'Неверный пароль',
        'auth/user-not-found': 'Пользователь не найден',
        'auth/weak-password': 'Пароль слишком простой',
        'auth/too-many-requests': 'Слишком много попыток',
        'auth/network-request-failed': 'Ошибка сети',
        'auth/unauthorized-domain': 'Домен не разрешён в Firebase (Authorized domains)',
        'auth/invalid-email': 'Ник содержит недопустимые символы'
    };
    return map[code] || 'Ошибка: ' + code;
}

document.getElementById('reg-btn').addEventListener('click', async () => {
    const nick = document.getElementById('reg-nick').value.trim();
    const pass = document.getElementById('reg-pass').value;
    const pass2 = document.getElementById('reg-pass2').value;

    if (!nick || !pass || !pass2) return showMessage('reg-msg', 'Заполните все поля', 'error');
    if (nick.length < 3) return showMessage('reg-msg', 'Ник минимум 3 символа', 'error');
    if (!/^[a-zA-Z0-9_]+$/.test(nick)) return showMessage('reg-msg', 'Ник: латиница, цифры, _', 'error');
    if (pass.length < 6) return showMessage('reg-msg', 'Пароль минимум 6 символов', 'error');
    if (pass !== pass2) return showMessage('reg-msg', 'Пароли не совпадают', 'error');

    const btn = document.getElementById('reg-btn');
    btn.disabled = true;
    try {
        const cred = await createUserWithEmailAndPassword(auth, nickToEmail(nick), pass);
        await updateProfile(cred.user, { displayName: nick });
        await setDoc(doc(db, 'users', cred.user.uid), {
            nick: nick,
            createdAt: new Date().toISOString()
        });
        showMessage('reg-msg', 'Регистрация успешна', 'success');
        setTimeout(() => window.location.href = 'index.html', 800);
    } catch (e) {
        showMessage('reg-msg', translateError(e.code), 'error');
    }
    btn.disabled = false;
});

document.getElementById('login-btn').addEventListener('click', async () => {
    const nick = document.getElementById('login-nick').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!nick || !pass) return showMessage('login-msg', 'Заполните все поля', 'error');

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    try {
        await signInWithEmailAndPassword(auth, nickToEmail(nick), pass);
        showMessage('login-msg', 'Успешный вход', 'success');
        setTimeout(() => window.location.href = 'index.html', 800);
    } catch (e) {
        showMessage('login-msg', translateError(e.code), 'error');
    }
    btn.disabled = false;
});
</script>
</body>
</html>
